  .blinke { animation: ble 1s steps(1) infinite; }
  @keyframes ble { 50% { opacity: 0; } }
  .drawe { stroke-dasharray: 700; stroke-dashoffset: 700; animation: dre 5s ease-out infinite; }
  @keyframes dre { 0% { stroke-dashoffset: 700; } 60%,90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
</style>
