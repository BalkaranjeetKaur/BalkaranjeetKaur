<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
<defs>
  <linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b24"/><stop offset="0.5" stop-color="#140a33"/><stop offset="1" stop-color="#03202e"/>
  </linearGradient>
  <linearGradient id="accc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00e5ff"/><stop offset="0.5" stop-color="#b388ff"/><stop offset="1" stop-color="#ff5fa2"/>
  </linearGradient>
  <radialGradient id="gac"><stop offset="0" stop-color="#7c4dff" stop-opacity="0.35"/><stop offset="1" stop-color="#7c4dff" stop-opacity="0"/></radialGradient>
  <radialGradient id="gbc"><stop offset="0" stop-color="#00bcd4" stop-opacity="0.28"/><stop offset="1" stop-color="#00bcd4" stop-opacity="0"/></radialGradient>
  <pattern id="gridc" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
  </pattern>
  <filter id="glowc" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="clipc"><rect x="2" y="2" width="100%" height="100%" rx="18"/></clipPath>
</defs>
<style>
  .pulsec { animation: puc 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes puc { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: .6; } }
  .blinkc { animation: blc 1s steps(1) infinite; }
  @keyframes blc { 50% { opacity: 0; } }
  .drawc { stroke-dasharray: 700; stroke-dashoffset: 700; animation: drc 5s ease-out infinite; }
  @keyframes drc { 0% { stroke-dashoffset: 700; } 60%,90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
</style>
