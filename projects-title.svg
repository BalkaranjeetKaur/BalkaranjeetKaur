<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 130" width="1280" height="130">
<defs>
  <linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b24"/><stop offset="0.5" stop-color="#140a33"/><stop offset="1" stop-color="#03202e"/>
  </linearGradient>
  <linearGradient id="accd" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00e5ff"/><stop offset="0.5" stop-color="#b388ff"/><stop offset="1" stop-color="#ff5fa2"/>
  </linearGradient>
  <radialGradient id="gad"><stop offset="0" stop-color="#7c4dff" stop-opacity="0.35"/><stop offset="1" stop-color="#7c4dff" stop-opacity="0"/></radialGradient>
  <radialGradient id="gbd"><stop offset="0" stop-color="#00bcd4" stop-opacity="0.28"/><stop offset="1" stop-color="#00bcd4" stop-opacity="0"/></radialGradient>
  <pattern id="gridd" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
  </pattern>
  <filter id="glowd" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="clipd"><rect x="2" y="2" width="100%" height="100%" rx="18"/></clipPath>
</defs>
<style>
  .pulsed { animation: pud 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pud { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: .6; } }
  .blinkd { animation: bld 1s steps(1) infinite; }
  @keyframes bld { 50% { opacity: 0; } }
  .drawd { stroke-dasharray: 700; stroke-dashoffset: 700; animation: drd 5s ease-out infinite; }
  @keyframes drd { 0% { stroke-dashoffset: 700; } 60%,90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
</style>
<g clip-path="url(#clipd)">
<rect x="2" y="2" width="1276" height="126" rx="18" fill="url(#bgd)"/>
<rect x="2" y="2" width="1276" height="126" rx="18" fill="url(#gridd)"/>
</g>
<rect x="2" y="2" width="1276" height="126" rx="18" fill="none" stroke="url(#accd)" stroke-width="2.5" stroke-opacity="0.85"/>
<text x="44" y="52" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="16" fill="#00e5ff" letter-spacing="2">04 //</text>
<text x="44" y="92" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="url(#accd)">Portfolio Projects</text>
<rect x="44" y="108" width="90" height="3" rx="1.5" fill="url(#accd)"/>
</svg>