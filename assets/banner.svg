  .float2 { animation: fl 7s ease-in-out infinite 1.5s; }
  .float3 { animation: fl 8s ease-in-out infinite 3s; }
  @keyframes fl { 0%,100% { opacity: .25; transform: translateY(0); } 50% { opacity: .9; transform: translateY(-8px); } }
  .pulse { animation: pu 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pu { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }
  .draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: dr 6s ease-out infinite; }
  .draw2 { stroke-dasharray: 900; stroke-dashoffset: 900; animation: dr 6s ease-out infinite .6s; }
  .rot { opacity: 0; animation: rot 9s infinite; }
  @keyframes rot { 0% { opacity: 0; } 4%,30% { opacity: 1; } 34%,100% { opacity: 0; } }
  @keyframes dr { 0% { stroke-dashoffset: 900; } 55%,85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
</style>
