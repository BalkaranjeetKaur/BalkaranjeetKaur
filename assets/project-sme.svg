<style>
  .pulsef { animation: puf 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes puf { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: .6; } }
  .blinkf { animation: blf 1s steps(1) infinite; }
  @keyframes blf { 50% { opacity: 0; } }
  .drawf { stroke-dasharray: 700; stroke-dashoffset: 700; animation: drf 5s ease-out infinite; }
  @keyframes drf { 0% { stroke-dashoffset: 700; } 60%,90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
</style>
