  </filter>
  <clipPath id="clipb"><rect x="2" y="2" width="100%" height="100%" rx="18"/></clipPath>
</defs>
<style>
  .pulseb { animation: pub 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pub { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: .6; } }
  .blinkb { animation: blb 1s steps(1) infinite; }
  @keyframes blb { 50% { opacity: 0; } }
  .drawb { stroke-dasharray: 700; stroke-dashoffset: 700; animation: drb 5s ease-out infinite; }
  @keyframes drb { 0% { stroke-dashoffset: 700; } 60%,90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
</style>
